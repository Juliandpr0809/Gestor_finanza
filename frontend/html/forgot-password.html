<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <meta name="theme-color" content="#06070c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Recuperar Contraseña - OrdenC</title>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Modern Theme -->
    <link rel="stylesheet" href="../css/modern-theme.css">
    <link rel="stylesheet" href="../css/auth.css">
    
    <style>
        .forgot-password-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: linear-gradient(135deg, #06070c 0%, #1a1a2e 100%);
        }

        .forgot-password-box {
            width: 100%;
            max-width: 400px;
            background: rgba(15, 15, 25, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.4s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .forgot-password-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .forgot-password-icon {
            font-size: 48px;
            color: #667EEA;
            margin-bottom: 16px;
            display: block;
        }

        .forgot-password-title {
            font-size: 24px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 8px;
        }

        .forgot-password-subtitle {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
            line-height: 1.5;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #fff;
            font-size: 14px;
            transition: all 0.2s;
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .form-group input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.08);
            border-color: #667EEA;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-message {
            margin-top: 12px;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            display: none;
        }

        .form-message.error {
            background: rgba(255, 59, 48, 0.1);
            color: #FF6B6B;
            border-left: 3px solid #FF6B6B;
        }

        .form-message.success {
            background: rgba(0, 210, 160, 0.1);
            color: #00D4AA;
            border-left: 3px solid #00D4AA;
        }

        .form-message.show {
            display: block;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667EEA 0%, #764BA2 100%);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .back-to-login {
            text-align: center;
            margin-top: 20px;
        }

        .back-to-login a {
            color: #667EEA;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s;
        }

        .back-to-login a:hover {
            color: #764BA2;
        }

        .success-box {
            text-align: center;
            display: none;
        }

        .success-box.show {
            display: block;
        }

        .success-icon {
            font-size: 48px;
            color: #00D4AA;
            margin-bottom: 16px;
            animation: bounce 0.6s ease;
        }

        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
    </style>
</head>

<body>
    <div class="forgot-password-container">
        <div class="forgot-password-box">
            <!-- Formulario -->
            <div id="formContainer">
                <div class="forgot-password-header">
                    <i class="fas fa-envelope forgot-password-icon"></i>
                    <h1 class="forgot-password-title">Recuperar Contraseña</h1>
                    <p class="forgot-password-subtitle">Ingresa tu email para recibir instrucciones</p>
                </div>

                <form id="forgotPasswordForm">
                    <div class="form-group">
                        <label for="email">
                            <i class="fas fa-envelope"></i> Email
                        </label>
                        <input type="email" id="email" name="email" placeholder="tu@email.com" required>
                    </div>

                    <div id="formMessage" class="form-message"></div>

                    <button type="submit" class="btn-submit">
                        <i class="fas fa-paper-plane"></i>
                        <span>Enviar Instrucciones</span>
                    </button>
                </form>

                <div class="back-to-login">
                    <a href="login.html"><i class="fas fa-arrow-left"></i> Volver al login</a>
                </div>
            </div>

            <!-- Mensaje de éxito -->
            <div id="successContainer" class="success-box">
                <i class="fas fa-check-circle success-icon"></i>
                <h2 class="forgot-password-title">¡Revisa tu email!</h2>
                <p class="forgot-password-subtitle">
                    Si tu email existe en nuestro sistema, recibirás un link para cambiar tu contraseña.
                    <br><br>
                    El link es válido por 24 horas.
                </p>
                <div class="back-to-login">
                    <a href="login.html"><i class="fas fa-arrow-left"></i> Volver al login</a>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/api.js?v=27"></script>
    <script src="../js/sw-update-handler.js"></script>
    <script>
        const forgotPasswordForm = document.getElementById('forgotPasswordForm');
        const formMessage = document.getElementById('formMessage');
        const formContainer = document.getElementById('formContainer');
        const successContainer = document.getElementById('successContainer');

        forgotPasswordForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const submitBtn = forgotPasswordForm.querySelector('.btn-submit');
            const originalText = submitBtn.innerHTML;
            
            // Mostrar estado de carga
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i><span>Enviando...</span>';
            formMessage.classList.remove('show', 'error', 'success');
            
            try {
                const response = await api.request('/auth/forgot-password', {
                    method: 'POST',
                    body: JSON.stringify({ email })
                });
                
                // Mostrar éxito
                formContainer.classList.add('hidden');
                formContainer.style.display = 'none';
                successContainer.classList.add('show');
                successContainer.style.display = 'block';
                
                console.log('✅ Email de recuperación enviado');
                
            } catch (error) {
                console.error('Error:', error);
                formMessage.classList.add('show', 'error');
                formMessage.textContent = error.message || 'Error al procesar solicitud';
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalText;
            }
        });
    </script>
</body>

</html>
